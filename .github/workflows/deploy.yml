name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'cf-problems-frontend/**'
      - '!cf-problems-frontend/build/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

# Daily updates and code releases share the same publication lock.
concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    defaults:
      run:
        working-directory: cf-problems-frontend
    steps:
      # Always publish the latest main, including commits made by the crawler.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: cf-problems-frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: cf-problems-frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: cf-problems-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build:workers
      - run: pnpm run deploy:check
      - name: Deploy static assets to Cloudflare
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
