name: Package manager comparison
on:
  push:
    branches: [codex/migrate-pnpm]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 87e5c4676e9a265335e5c77804c2c79bf76ac356
          path: _baseline
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: cf-problems-frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: cp -R _baseline/cf-problems-frontend _npm
      - name: Measure cold and warm installs plus builds
        shell: python
        run: |
          import subprocess,time,json,shutil,os,statistics
          from pathlib import Path
          root=Path.cwd(); results=[]
          for i in range(4):
           for manager in (['npm','pnpm'] if i%2==0 else ['pnpm','npm']):
            folder=root/('_npm' if manager=='npm' else 'cf-problems-frontend')
            if (folder/'node_modules').exists():shutil.rmtree(folder/'node_modules')
            install=['npm','ci','--cache','/tmp/benchmark-npm-cache'] if manager=='npm' else ['pnpm','install','--frozen-lockfile','--store-dir','/tmp/benchmark-pnpm-store']
            row={'manager':manager,'cache':'cold' if i==0 else 'warm','round':i}
            for name,cmd in [('install',install),('build',[manager,'run','build'])]:
             start=time.perf_counter();subprocess.run(cmd,cwd=folder,check=True);row[name]=round(time.perf_counter()-start,3)
            results.append(row);print('MEASUREMENT',json.dumps(row),flush=True)
          Path('package-manager-benchmark.json').write_text(json.dumps(results,indent=2))
          summary='| Manager | Cache | Install (s) | Build (s) | Total (s) |\n| --- | --- | ---: | ---: | ---: |\n'
          for cache in ['cold','warm']:
           for manager in ['npm','pnpm']:
            rows=[r for r in results if r['cache']==cache and r['manager']==manager];a=statistics.median(r['install'] for r in rows);b=statistics.median(r['build'] for r in rows);summary+=f'| {manager} | {cache} | {a:.3f} | {b:.3f} | {a+b:.3f} |\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(summary)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-manager-benchmark
          path: package-manager-benchmark.json
