name: Regular Crawl
on:
  schedule:
    - cron: '0 0 * * *' # Once per day at midnight
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regular-crawl
  cancel-in-progress: false

jobs:
  Crawl-Codeforces:
    name: Crawl-Codeforces-Job
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main

    - uses: actions/setup-python@v6
      with:
        # Keep the runtime compatible with the pinned crawler dependencies.
        python-version: '3.11'
        architecture: 'x64'

    - name: Run Google Chrome Headless
      run: |
        google-chrome-stable --headless --disable-gpu &

    - name: install python packages
      run: python -m pip install -r requirements.txt
      working-directory: ${{ github.workspace }}/cf-problems-crawler

    - name: run script
      run: python main.py
      working-directory: ${{ github.workspace }}/cf-problems-crawler

    - name: copy contests.json
      run: cp contests.json ../cf-problems-frontend/src/utils
      working-directory: ${{ github.workspace }}/cf-problems-crawler

    - name: git setting
      run: |
        git config user.name actions-user
        git config user.email action@github.com

    - name: Commit files
      run: |
        git pull
        git add cf-problems-crawler/contests.json cf-problems-frontend/src/utils/contests.json
        if ! git diff --cached --quiet; then git commit -m "Update contests.json (By GitHub Actions)"; fi;
        git push
    - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

  Deploy-Frontend:
    needs: Crawl-Codeforces
    permissions:
      contents: write
    # GITHUB_TOKEN commits do not trigger push workflows; call deployment directly.
    uses: ./.github/workflows/deploy.yml
